<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Kept demo film</title>
<style>
@font-face { font-family: Inter; src: url(/node_modules/@fontsource-variable/inter/files/inter-latin-wght-normal.woff2) format("woff2"); font-weight: 100 900; }
@font-face { font-family: Mono; src: url(/node_modules/@fontsource-variable/jetbrains-mono/files/jetbrains-mono-latin-wght-normal.woff2) format("woff2"); font-weight: 100 800; }
:root { --ink: #0a0a0a; --canvas: #f5f5f5; --blue: #0066f5; --muted: #8a8a8a; }
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { width: 1920px; height: 1080px; overflow: hidden; background: #000; }
body { font-family: Inter, system-ui, sans-serif; font-weight: 600; letter-spacing: -0.05em; color: var(--ink); -webkit-font-smoothing: antialiased; }
#stage { position: absolute; inset: 0; overflow: hidden; background: var(--canvas); perspective: 2400px; }
.layer { position: absolute; inset: 0; }
.scene { position: absolute; inset: 0; display: none; perspective: 2400px; }
.glow { position: absolute; inset: -20%; pointer-events: none; }
.w { display: inline-block; white-space: pre; will-change: transform, opacity; }
.gray { color: var(--muted); }
.big { font-size: 112px; line-height: 0.98; }
.mid { font-size: 64px; line-height: 1.04; }
.cap { position: absolute; left: 0; right: 0; text-align: center; }
/* app screen */
.screen { position: absolute; left: 960px; top: 540px; width: 1440px; height: 810px; margin: -405px 0 0 -720px; border-radius: 22px; overflow: hidden; background: #f5f5f5;
  box-shadow: 0 60px 120px -30px rgba(0,0,0,.35), 0 0 0 1px rgba(0,0,0,.06); transform-origin: 50% 50%; backface-visibility: hidden; }
.screen .inner { position: absolute; left: 0; top: 0; width: 1440px; height: 810px; transform-origin: 0 0; }
.screen img { position: absolute; left: 0; top: 0; width: 1440px; height: 810px; }
.cursor { position: absolute; width: 26px; height: 26px; margin: -3px 0 0 -5px; z-index: 5; filter: drop-shadow(0 2px 3px rgba(0,0,0,.35)); }
.ripple { position: absolute; width: 60px; height: 60px; margin: -30px 0 0 -30px; border-radius: 50%; border: 3px solid var(--blue); z-index: 4; }
.hl { position: absolute; border-radius: 14px; box-shadow: 0 0 0 3px var(--blue), 0 0 40px rgba(0,102,245,.35); z-index: 3; }
/* chrome */
#chapters { position: absolute; left: 50%; bottom: 34px; transform: translateX(-50%); display: flex; flex-direction: column; align-items: center; gap: 12px; z-index: 50; }
#pills { display: flex; gap: 6px; padding: 6px; border-radius: 999px; background: rgba(255,255,255,.72); box-shadow: 0 8px 30px rgba(0,0,0,.08), 0 0 0 1px rgba(0,0,0,.05); backdrop-filter: blur(10px); }
.pill { position: relative; padding: 9px 18px; border-radius: 999px; font-size: 17px; letter-spacing: -0.02em; color: #6b6b6b; overflow: hidden; }
.pill.on { background: var(--ink); color: #fff; }
.pill .shine { position: absolute; top: 0; bottom: 0; width: 60px; background: linear-gradient(90deg, transparent, rgba(255,255,255,.45), transparent); }
#ruler { position: relative; width: 760px; height: 14px; }
#ruler i { position: absolute; bottom: 0; width: 2px; background: rgba(0,0,0,.18); border-radius: 1px; }
#tag { position: absolute; right: 40px; top: 34px; z-index: 60; font-size: 18px; letter-spacing: -0.02em; padding: 10px 16px; border-radius: 999px; background: rgba(10,10,10,.82); color: #fff; display: flex; align-items: center; gap: 10px; }
#tag b { width: 9px; height: 9px; border-radius: 50%; background: var(--blue); display: inline-block; }
#dot { position: absolute; left: 0; top: 0; border-radius: 50%; background: var(--blue); z-index: 70; box-shadow: 0 0 30px rgba(0,102,245,.6); }
#flash { position: absolute; inset: 0; background: #fff; z-index: 80; pointer-events: none; opacity: 0; }
/* cold open chat */
.chat { position: absolute; left: 50%; top: 120px; width: 760px; margin-left: -380px; zoom: 1.32; }
.bub { position: absolute; max-width: 560px; padding: 20px 28px; border-radius: 32px; font-size: 40px; letter-spacing: -0.03em; font-weight: 500; }
.bub.me { right: 0; background: #fff; color: var(--ink); border-bottom-right-radius: 10px; }
.bub.them { left: 0; background: #262626; color: #fff; border-bottom-left-radius: 10px; }
.meta { position: absolute; font-size: 22px; letter-spacing: -0.01em; color: #7a7a7a; font-weight: 500; }
.chip { display: inline-flex; align-items: center; gap: 10px; padding: 10px 16px; border-radius: 16px; background: #f0f0f0; font-size: 26px; margin-top: 12px; font-weight: 500; }
/* cards */
.card { position: absolute; border-radius: 28px; background: #fff; box-shadow: 0 30px 80px -20px rgba(0,0,0,.25), 0 0 0 1px rgba(0,0,0,.05); }
.dark { background: #141414; color: #fff; box-shadow: 0 30px 80px -20px rgba(0,0,0,.6), 0 0 0 1px rgba(255,255,255,.08); }
.eyebrow { font-size: 20px; letter-spacing: -0.01em; color: var(--muted); font-weight: 500; }
.crop { position: absolute; overflow: hidden; border-radius: 22px; background: #fff; box-shadow: 0 30px 80px -20px rgba(0,0,0,.3), 0 0 0 1px rgba(0,0,0,.06); }
.crop img { position: absolute; }
.term { position: absolute; left: 260px; top: 230px; width: 1400px; height: 640px; border-radius: 26px; background: #0d0d0d; box-shadow: 0 50px 120px -30px rgba(0,102,245,.35), 0 0 0 1px rgba(255,255,255,.08); font-family: Mono, monospace; letter-spacing: 0; font-weight: 500; color: #d6d6d6; padding: 34px 40px; overflow: hidden; }
.term .row { position: relative; height: 104px; font-size: 22px; line-height: 1.5; }
.term .req { color: #8a8a8a; }
.term .req em { font-style: normal; color: #fff; }
.term .res { color: #cfcfcf; }
.badge { position: absolute; right: 0; top: 10px; font-family: Inter; letter-spacing: -0.01em; font-weight: 600; font-size: 22px; padding: 10px 20px; border-radius: 999px; }
.b-paid { background: var(--blue); color: #fff; }
.b-ask { box-shadow: inset 0 0 0 2px #fff; color: #fff; }
.b-deny { background: #fff; color: #000; }
.stacc { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-size: 300px; letter-spacing: -0.06em; }
svg text { font-family: Inter; }
</style>
</head>
<body>
<div id="stage">
  <div id="scenes" class="layer"></div>
  <div id="chapters"><div id="pills"></div><div id="ruler"></div></div>
  <div id="tag"><b></b><span></span></div>
  <div id="dot"></div>
  <div id="flash"></div>
</div>
<script type="module">
import { CHAPTERS, DURATION, FPS, GITHUB, SCENES, SITE, T, VO } from "./timeline.js";

// ---------- math
const cl = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const P = (t, a, b) => cl((t - a) / (b - a));
const eo = (x) => 1 - (1 - x) ** 3;
const eio = (x) => (x < 0.5 ? 4 * x * x * x : 1 - (-2 * x + 2) ** 3 / 2);
const back = (x) => { const c = 1.6; return 1 + (c + 1) * (x - 1) ** 3 + c * (x - 1) ** 2; };
const lerp = (a, b, x) => a + (b - a) * x;
const springIn = (t, t0, d = 0.6) => back(P(t, t0, t0 + d));
const h = (tag, cls, parent, html) => { const e = document.createElement(tag); if (cls) e.className = cls; if (html !== undefined) e.innerHTML = html; if (parent) parent.appendChild(e); return e; };
const css = (e, o) => { for (const k in o) e.style[k] = o[k]; };
const show = (e, on) => { e.style.display = on ? "" : "none"; };
const noise = (i) => { const x = Math.sin(i * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); };

// ---------- data
const [shots, graph, calls] = await Promise.all([
  fetch("shots/shots.json").then((r) => r.json()),
  fetch("out/graph.json").then((r) => r.json()),
  fetch("data/agent-calls.json").then((r) => r.json()),
]);
await document.fonts.load("600 100px Inter"); await document.fonts.load("500 20px Mono");
const imgCache = new Map();
const IMG = (n) => { if (!imgCache.has(n)) { const i = new Image(); i.src = `shots/${n}.jpg`; imgCache.set(n, i); } return imgCache.get(n); };
const allShots = Object.keys(shots).concat(["s01_landing", "s32_counter", "s34_proved", "s44_settled", "s42_delivered", "s32_live", "s53a_broken", "s53b_broken", "s52a_typing", "s52b_typing", "s60_mandate", "s62_approved", "s74_closed", "s71_bt20", "s13_template"]);
await Promise.all([...new Set(allShots)].map((n) => IMG(n).decode().catch(() => console.warn("missing", n))));

// ---------- text helpers: kinetic words ("a b | c d" -> after | is gray)
function words(parent, text, cls = "") {
  const box = h("div", cls, parent);
  let gray = false; const ws = [];
  for (const part of text.split(" ")) {
    if (part === "|") { gray = true; continue; }
    const s = h("span", "w" + (gray ? " gray" : ""), box, part + " ");
    ws.push(s);
  }
  box.ws = ws; return box;
}
function playWords(box, t, t0, per = 0.09, dur = 0.5) {
  box.ws.forEach((s, i) => { const x = P(t, t0 + i * per, t0 + i * per + dur); s.style.opacity = eo(x); s.style.transform = `translateY(${(1 - eo(x)) * 40}px)`; s.style.filter = `blur(${(1 - x) * 8}px)`; });
}
function fadeBox(box, t, a, b, d = 0.4) { box.style.opacity = P(t, a, a + d) * (1 - P(t, b - d, b)); }

// ---------- app screen with camera, cursor and click ripple
function Screen(parent) {
  const el = h("div", "screen", parent), inner = h("div", "inner", el);
  const a = h("img", "", inner), b = h("img", "", inner);
  const hl = h("div", "hl", inner), rip = h("div", "ripple", inner);
  const cur = h("div", "cursor", inner, `<svg viewBox="0 0 24 24" width="26" height="26"><path d="M4 2l16 9.5-7 1.5-3.5 6.5z" fill="#0a0a0a" stroke="#fff" stroke-width="1.6" stroke-linejoin="round"/></svg>`);
  return {
    el,
    /** shot A crossfading to shot B by mix; cam = [fx, fy, zoom] in shot CSS px */
    set(nA, nB = null, mix = 0, cam = [720, 405, 1]) {
      if (a.dataset.n !== nA) { a.src = IMG(nA).src; a.dataset.n = nA; }
      if (nB) { if (b.dataset.n !== nB) { b.src = IMG(nB).src; b.dataset.n = nB; } b.style.opacity = mix; show(b, true); } else show(b, false);
      const [fx, fy, z] = cam;
      const tx = cl(720 - fx * z, 1440 - 1440 * z, 0), ty = cl(405 - fy * z, 810 - 810 * z, 0);
      inner.style.transform = `translate(${tx}px, ${ty}px) scale(${z})`;
    },
    cursor(x, y, on = true) { show(cur, on); css(cur, { left: x + "px", top: y + "px" }); },
    ripple(x, y, k) { show(rip, k > 0 && k < 1); css(rip, { left: x + "px", top: y + "px", transform: `scale(${0.3 + k * 1.4})`, opacity: 1 - k }); },
    highlight(r, o) { show(hl, o > 0.01); if (r) css(hl, { left: r[0] - 6 + "px", top: r[1] - 6 + "px", width: r[2] + 12 + "px", height: r[3] + 12 + "px", opacity: o }); },
    pose({ x = 0, y = 0, s = 1, rx = 0, ry = 0, rz = 0, o = 1 }) { el.style.transform = `translate(${x}px, ${y}px) rotateX(${rx}deg) rotateY(${ry}deg) rotateZ(${rz}deg) scale(${s})`; el.style.opacity = o; },
  };
}
const R = (n, k) => { const r = shots[n]?.rects?.[k]; return r ? [r.x, r.y, r.width, r.height] : null; };
const ctr = (r) => [r[0] + r[2] / 2, r[1] + r[3] / 2];
/** cursor path: from p0 to p1 between t0..t1, click at tc */
function cursorTo(sc, t, from, to, t0, t1, tc) {
  const k = eio(P(t, t0, t1));
  const x = lerp(from[0], to[0], k), y = lerp(from[1], to[1], k) - Math.sin(Math.PI * k) * 40;
  sc.cursor(x, y, true);
  sc.ripple(to[0], to[1], tc ? P(t, tc, tc + 0.45) : 0);
}
function Crop(parent, name, r, scale = 1) {
  const el = h("div", "crop", parent), im = h("img", "", el); im.src = IMG(name).src;
  css(el, { width: r[2] * scale + "px", height: r[3] * scale + "px" });
  css(im, { width: 1440 * scale + "px", height: 810 * scale + "px", left: -r[0] * scale + "px", top: -r[1] * scale + "px" });
  return el;
}

// ---------- global chrome
const $ = (id) => document.getElementById(id);
const pills = CHAPTERS.slice(1, -1).map((c) => { const p = h("div", "pill", $("pills"), c.label); p.shine = h("div", "shine", p); p.c = c; return p; });
for (let i = 0; i <= 60; i++) { const tk = h("i", "", $("ruler")); css(tk, { left: (i / 60) * 758 + "px", height: (i % 5 === 0 ? 14 : 7) + "px" }); }
const dot = $("dot"), tag = $("tag"), flash = $("flash");
let D = null; // dot state set by scenes: {x,y,r,o}
const setDot = (x, y, r = 14, o = 1) => { D = { x, y, r, o }; };

// ---------- scenes
const S = {};
const root = $("scenes");
function scene(id, build, update) { const el = h("div", "scene", root); const sc = SCENES.find((s) => s.id === id); S[id] = { el, sc, ctx: build(el), update }; }
const glow = (el, bg, g = "rgba(0,102,245,.18)", at = "50% 60%") => { el.style.background = bg; const d = h("div", "glow", el); d.style.background = `radial-gradient(ellipse 50% 40% at ${at}, ${g}, transparent 70%)`; return d; };

// 1. COLD OPEN
scene("cold", (el) => {
  el.style.background = "#000";
  const A = h("div", "chat", el), B = h("div", "chat", el);
  const mk = (box, list) => list.map((m) => {
    if (m.div) { const d = h("div", "meta", box, m.div); css(d, { left: "0", right: "0", textAlign: "center", top: m.y + "px" }); d.m = m; return d; }
    const b = h("div", "bub " + m.side, box, m.text + (m.file ? `<div class="chip">${m.file}</div>` : "")); b.style.top = m.y + "px"; b.m = m;
    if (m.status) { const s = h("div", "meta", box, m.status); css(s, { right: "8px", top: m.y + 104 + "px" }); b.st = s; }
    return b;
  });
  const bt = T.bubbles;
  const a = mk(A, [{ div: "Mon 10:02", y: 0, t: 0.1 }, { side: "me", text: "Logo by Friday?", y: 50, t: bt[0] }, { side: "them", text: "Send $100 to start.", y: 160, t: bt[1] }, { side: "me", text: "Sent.", y: 270, t: bt[2], sent: true }, { div: "Friday", y: 400, t: 2.6 }, { side: "me", text: "Hello?", y: 450, t: bt[3] }, { side: "me", text: "Are you there?", y: 560, t: bt[4], status: "Not delivered", st: T.notDelivered }]);
  const b = mk(B, [{ div: "Designer · Tue 16:40", y: 0, t: 4.9 }, { side: "me", text: "Final logo attached.", y: 50, t: bt[5], file: "acme-logo.svg" }, { side: "them", text: "Love it. Paying now!", y: 245, t: bt[6] }, { side: "me", text: "Paid?", y: 355, t: bt[7] }, { side: "me", text: "Hello?", y: 465, t: bt[8], status: "Seen", st: T.seen }]);
  const line = h("div", "cap big", el); line.style.top = "430px"; line.style.color = "#fff";
  const l1 = words(line, "The payment worked."), l2 = words(line, "| The promise didn't.");
  return { A, B, a, b, line, l1, l2 };
}, (t, c) => {
  const pop = (arr) => arr.forEach((e) => { const k = springIn(t, e.m.t, 0.5); e.style.opacity = P(t, e.m.t, e.m.t + 0.15); e.style.transform = `scale(${0.6 + 0.4 * k}) translateY(${(1 - P(t, e.m.t, e.m.t + 0.4)) * 30}px)`; e.style.transformOrigin = e.m.side === "them" ? "0 100%" : "100% 100%"; if (e.st) e.st.style.opacity = P(t, e.m.st, e.m.st + 0.2); });
  pop(c.a); pop(c.b);
  const f = P(t, T.flip, T.flip + 0.45);
  c.A.style.transform = `rotateY(${eio(f) * 90}deg)`; show(c.A, f < 1);
  const g = P(t, T.flip + 0.3, T.flip + 0.75);
  c.B.style.transform = `rotateY(${(1 - eo(g)) * -90}deg)`; show(c.B, g > 0 && t < 9.9); c.B.style.opacity = 1 - P(t, 9.2, 9.8);
  playWords(c.l1, t, T.line1, 0.12); playWords(c.l2, t, T.line2, 0.12);
  c.line.style.opacity = 1 - P(t, T.coldOut, T.coldOut + 0.5);
  // the dot: leaves with "Sent.", then returns toward the title
  if (t > T.dotLeave - 0.4 && t < T.dotLeave + 1.2) {
    const sent = c.a[3].getBoundingClientRect();
    const k = P(t, T.dotLeave, T.dotLeave + 1.0);
    const x0 = sent.right - 30, y0 = sent.top + sent.height / 2;
    setDot(lerp(x0, 2000, eio(k) ** 1.4), y0 - Math.sin(k * Math.PI) * 260 - k * 300, 14 + k * 6, P(t, T.dotLeave - 0.4, T.dotLeave - 0.1));
  }
});

// 2. TITLE
scene("title", (el) => {
  el.style.background = "var(--canvas)";
  const word = h("div", "", el); css(word, { position: "absolute", left: "0", right: "0", top: "250px", textAlign: "center", fontSize: "400px", lineHeight: "1", letterSpacing: "-0.065em" });
  const k = h("span", "", word, "Kept"); const per = h("span", "", word); css(per, { display: "inline-block", width: "96px" });
  const ring = h("div", "", el); css(ring, { position: "absolute", width: "100px", height: "100px", margin: "-50px 0 0 -50px", borderRadius: "50%", border: "4px solid var(--blue)" });
  const sub = h("div", "cap mid", el); sub.style.top = "760px";
  const w = words(sub, "Money moves only when | a promise is kept.");
  return { word, k, per, ring, w };
}, (t, c) => {
  const x = P(t, T.logoHit, T.logoHit + 0.5);
  c.k.style.clipPath = `inset(0 ${100 - eo(x) * 100}% 0 0)`;
  c.word.style.transform = `scale(${1.08 - 0.08 * eo(P(t, T.logoHit, T.logoHit + 1.4))})`;
  const r = c.per.getBoundingClientRect();
  const px = r.left + 46, py = r.bottom - 74;
  const k = P(t, T.dotReturn, T.logoHit);
  if (t < T.logoHit) setDot(lerp(-60, px, eio(k)), py - Math.sin(Math.PI * eio(k)) * 380 + (1 - k) * 200, 18 + 22 * k, 1);
  else setDot(px, py, 40, 1 - P(t, 21.4, 21.9));
  const rk = P(t, T.logoHit, T.logoHit + 0.9);
  css(c.ring, { left: px + "px", top: py + "px", transform: `scale(${0.5 + rk * 6})`, opacity: rk > 0 && rk < 1 ? (1 - rk) : 0 });
  playWords(c.w, t, T.sub, 0.08);
  S.title.el.style.opacity = 1 - P(t, 21.5, 22);
});

// 3. SAY IT
scene("say", (el) => {
  glow(el, "var(--canvas)", "rgba(0,102,245,.16)", "50% 55%");
  const sc = Screen(el);
  const top = h("div", "cap", el); css(top, { top: "64px", fontSize: "54px" });
  const lead = h("span", "", top, "Say the deal the way you'd text ");
  const box = h("span", "", top); css(box, { display: "inline-block", position: "relative", background: "var(--ink)", color: "#fff", borderRadius: "16px", padding: "4px 20px", overflow: "hidden", verticalAlign: "bottom", height: "72px", width: "370px", textAlign: "left", whiteSpace: "nowrap" });
  const opts = ["a freelancer.", "a plumber.", "a supplier."].map((s) => { const e = h("div", "", box, s); css(e, { position: "absolute", left: "20px", top: "4px" }); return e; });
  // Claude drafting illustration
  const panel = h("div", "card dark", el); css(panel, { left: "1010px", top: "190px", width: "820px", height: "700px", padding: "44px" });
  h("div", "eyebrow", panel, "Claude · writing it down");
  const pr = h("div", "", panel); pr.style.marginTop = "26px";
  h("div", "eyebrow", pr, "Promises");
  const cards = ["Designer gets $300 for on-time delivery", "Client gets $200 back if nothing arrives on time"].map((s) => { const c = h("div", "", pr, `<span style="display:inline-block;width:26px;height:26px;border-radius:50%;background:var(--blue);margin-right:16px;vertical-align:-4px"></span>${s}`); css(c, { marginTop: "16px", padding: "24px 26px", background: "#1f1f1f", borderRadius: "18px", fontSize: "30px", letterSpacing: "-0.03em" }); return c; });
  const rules = h("div", "", panel); rules.style.marginTop = "36px";
  h("div", "eyebrow", rules, "Rules that move the money");
  const rl = ["$100 released up front", "$200 when the SVG is accepted", "Refund $200 if nothing by day 7"].map((s) => { const c = h("div", "", rules, s); css(c, { marginTop: "12px", fontSize: "28px", color: "#cfcfcf", letterSpacing: "-0.03em" }); return c; });
  const shimmer = h("div", "", panel); css(shimmer, { position: "absolute", left: "44px", right: "44px", top: "104px", height: "8px", borderRadius: "4px", background: "linear-gradient(90deg,#222,#0066f5,#222)", backgroundSize: "300% 100%" });
  return { sc, top, opts, box, panel, cards, rl, shimmer };
}, (t, c) => {
  const s0 = T.screenIn;
  const k = eo(P(t, s0, s0 + 1.1));
  const d = eio(P(t, T.draft, T.draft + 0.9));
  c.sc.pose({ y: (1 - k) * 700 + 40 - d * 20, rx: (1 - k) * 35 + 6 * (1 - d), ry: -8 * d, s: 0.9 + 0.08 * k - 0.32 * d, x: -d * 420, o: P(t, s0, s0 + 0.3) });
  // typing frames (real captures every 12 characters)

  else if (t < T.broken) { n = "s52a_typing"; cam = [cx - 100, cy - 140, 1.4 - 0.15 * (1 - eo(P(t, T.cellClick + 0.12, T.typing)))]; c.sc.cursor(cx + 70, cy + 10, true); c.sc.ripple(cx, cy, P(t, T.cellClick + 0.12, T.cellClick + 0.55)); }
  else if (t < 99.2) { n = "s53a_broken"; const e = eio(P(t, T.broken + 0.6, T.broken + 1.6)); cam = [lerp(cx - 100, 720, e), lerp(cy - 140, 420, e), 1.4 - 0.25 * e]; c.sc.cursor(0, 0, false); c.sc.ripple(0, 0, 0); }
  else if (t < T.broken2) { const pre = t < T.coverClick + 0.1; n = pre ? "s50b_pre" : "s52b_typing"; cam = [600, 260, 1.3]; const [bx, by] = [cb[0] + 10, cb[1] + 10]; if (pre) cursorTo(c.sc, t, [1000, 600], [bx, by], 99.5, T.coverClick - 0.05, T.coverClick); else { c.sc.cursor(cx + 70, cy + 10, true); c.sc.ripple(bx, by, P(t, T.coverClick, T.coverClick + 0.45)); cam = [cx - 100, lerp(260, cy - 140, eio(P(t, 101.0, 101.8))), 1.3]; } }
  else { n = "s53b_broken"; cam = [1000, lerp(cy - 100, 520, eio(P(t, T.broken2 + 0.6, T.broken2 + 1.6))), 1.35 - 0.1 * eio(P(t, T.broken2 + 0.6, T.broken2 + 1.6))]; c.sc.cursor(0, 0, false); c.sc.ripple(0, 0, 0); }
  c.sc.set(n, null, 0, cam); c.sc.highlight(null, 0);
  // glitch slices on each break
  const g = (t > T.broken && t < T.broken + 0.45) || (t > T.broken2 && t < T.broken2 + 0.45);
  c.slices.forEach((s, i) => { const r = noise(Math.floor(t * 24) + i * 7.3); css(s, { display: g ? "block" : "none", top: r * 760 + "px", height: 6 + noise(i + Math.floor(t * 30)) * 40 + "px", opacity: 0.9 }); });
  const whip = P(t, T.cellClick, T.cellClick + 0.12) * (1 - P(t, T.cellClick + 0.12, T.cellClick + 0.3));
  c.sc.el.style.filter = g ? `contrast(1.4) brightness(${0.9 + noise(t * 40) * 0.3})` : whip > 0 ? `blur(${whip * 14}px)` : "";
  playWords(c.w1, t, VO.c2, 0.12); c.cap.style.opacity = t > VO.c2 - 0.1 && t < 99.4 ? 1 : 0;
  playWords(c.w2, t, VO.c3, 0.12); c.cap2.style.opacity = t > VO.c3 - 0.1 && t < T.notUs ? 1 : 0;
  c.notUs.style.opacity = P(t, T.notUs, T.notUs + 0.25) * (1 - P(t, 110.4, 110.9)); playWords(c.w3, t, T.notUs + 0.1, 0.1);
  S.cheat.el.style.opacity = 1 - P(t, 110.6, 111);
});

// 10. AGENTS: real API answers, then the real console
scene("agents", (el) => {
  glow(el, "#0a0a0a", "rgba(0,102,245,.22)", "50% 70%");
  const t1 = h("div", "", el); css(t1, { position: "absolute", left: "0", right: "0", top: "380px", textAlign: "center", color: "#fff", fontSize: "110px", lineHeight: "1" });
  const w = words(t1, "Give an agent a budget, | not your card.");
  const term = h("div", "term", el);
  const hdr = h("div", "", term, `<span style="color:#6b6b6b">agent → POST /agent/v1/spends · Office supplies budget · $200, max $50 each, ask above $30</span>`); css(hdr, { fontSize: "19px", marginBottom: "28px" });
  const LABEL = { executing: ["Paid", "b-paid"], needs_approval: ["Asks you", "b-ask"], denied: ["Denied", "b-deny"] };
  const rows = calls.map((cl) => {
    const r = h("div", "row", term);
    const req = h("div", "req", r, `$ spend <em>${cl.req.amountCents / 100 >= 10 ? "$" + (cl.req.amountCents / 100).toFixed(2) : ""}</em> · ${cl.req.description} · ${cl.req.merchantEmail}` + (cl.k === "fake" ? ` · token <em>mt_fake…</em>` : ""));
    const res = h("div", "res", r, cl.status === 401 ? `401 ${cl.res.error.code} · ${cl.res.error.message}` : `${cl.status} ${cl.res.status} · ${cl.res.reasons.join("; ")}`);
    const [lab, cls] = cl.status === 401 ? ["Refused · 401", "b-deny"] : LABEL[cl.res.status];
    const b = h("div", "badge " + cls, r, lab);
    r.req = req; r.res = res; r.b = b; return r;
  });
  const lab = h("div", "eyebrow", el, "Real responses from Kept's agent API (local deployment, PayPal simulator)"); css(lab, { position: "absolute", left: "260px", top: "890px", color: "#6b6b6b" });
  const bg = h("div", "layer", el); bg.style.background = "var(--canvas)";
  const sc = Screen(el);
  const cap = h("div", "", el); css(cap, { position: "absolute", left: "0", right: "0", top: "50px", textAlign: "center", fontSize: "56px" });
  const w2 = words(cap, "Close it. | Every unused dollar comes home.");
  return { t1, w, term, rows, sc, bg, lab, cap, w2 };
}, (t, c) => {
  playWords(c.w, t, VO.a1, 0.1); c.t1.style.opacity = 1 - P(t, T.terminal - 0.6, T.terminal - 0.2);
  c.t1.style.transform = `translateY(${-eio(P(t, T.terminal - 0.6, T.terminal)) * 80}px)`;
  const tk = eo(P(t, T.terminal, T.terminal + 0.8)), off = P(t, T.console - 0.4, T.console);
  c.term.style.opacity = P(t, T.terminal, T.terminal + 0.3) * (1 - off); c.term.style.transform = `translateY(${(1 - tk) * 120}px) rotateX(${(1 - tk) * 20}deg)`;
  c.lab.style.opacity = c.term.style.opacity;
  c.rows.forEach((r, i) => { const a = T.calls[i]; const typed = P(t, a, a + 0.4); r.req.style.opacity = P(t, a - 0.05, a); r.req.style.clipPath = `inset(0 ${100 - typed * 100}% 0 0)`; r.res.style.opacity = P(t, a + 0.45, a + 0.6); const bk = springIn(t, a + 0.45, 0.5); r.b.style.opacity = P(t, a + 0.45, a + 0.55); r.b.style.transform = `scale(${0.5 + 0.5 * bk})`; });
  // console: live feed -> closed -> backtest
  c.bg.style.opacity = P(t, T.console - 0.2, T.console + 0.2);
  const k = eo(P(t, T.console, T.console + 0.8));
  c.sc.pose({ y: 50 + (1 - k) * 500, s: 0.88, rx: (1 - k) * 20 + 3, o: P(t, T.console, T.console + 0.3) });
  let n, cam;
  if (t < T.closed) { n = "s62_approved"; cam = [400, 330, 1.25]; }
  else if (t < T.backtest) { n = "s74_closed"; cam = [330, 300, 1 + 0.6 * eio(P(t, T.closed, T.closed + 1.2))]; }
  else { n = "s71_bt20"; cam = [480, 220, 1.35]; }
  c.sc.set(n, null, 0, cam); c.sc.cursor(0, 0, false); c.sc.ripple(0, 0, 0); c.sc.highlight(null, 0);
  playWords(c.w2, t, VO.a3, 0.1); c.cap.style.opacity = t > VO.a3 - 0.1 ? 1 - P(t, T.backtest + 1.6, T.backtest + 2) : 0;
  if (t > T.closed + 0.3 && t < T.backtest) { const kk = eio(P(t, T.closed + 0.3, T.closed + 1.4)); setDot(lerp(700, 1500, kk), lerp(420, 980, kk) - Math.sin(Math.PI * kk) * 200, 14, 1 - P(t, T.closed + 1.3, T.closed + 1.6)); }
  S.agents.el.style.opacity = 1 - P(t, 132.7, 133);
});

// 11. CLOSE: staccato, silence, logo
scene("close", (el) => {
  el.style.background = "#000";
  const words4 = [["Say it.", "var(--blue)", "#fff"], ["Prove it.", "#fff", "var(--ink)"], ["Hold it.", "var(--blue)", "#fff"], ["Keep it.", "#000", "#fff"]].map(([s, bg, fg]) => { const d = h("div", "stacc", el, s); css(d, { background: bg, color: fg }); return d; });
  const end = h("div", "layer", el); end.style.background = "var(--canvas)";
  const word = h("div", "", end); css(word, { position: "absolute", left: "0", right: "0", top: "210px", textAlign: "center", fontSize: "300px", lineHeight: "1", letterSpacing: "-0.065em" });
  const k = h("span", "", word, "Kept"); const per = h("span", "", word); css(per, { display: "inline-block", width: "72px" });
  const tagl = h("div", "", end, "Money moves only when a promise is kept."); css(tagl, { position: "absolute", left: "0", right: "0", top: "560px", textAlign: "center", fontSize: "46px", color: "#6b6b6b" });
  const links = h("div", "", end, `${SITE ? `<span style="color:var(--ink)">${SITE}</span> &nbsp;·&nbsp; ` : ""}${GITHUB} &nbsp;·&nbsp; Built on PayPal + Claude`); css(links, { position: "absolute", left: "0", right: "0", top: "660px", textAlign: "center", fontSize: "30px", color: "#0a0a0a", letterSpacing: "-0.02em" });
  const disc = h("div", "", end, "Recorded on a local deployment with Kept's PayPal simulator: no real money moved. The Claude drafting step is shown as an illustration."); css(disc, { position: "absolute", left: "0", right: "0", bottom: "70px", textAlign: "center", fontSize: "21px", color: "#8a8a8a", fontWeight: "500", letterSpacing: "-0.01em" });
  const ring = h("div", "", end); css(ring, { position: "absolute", width: "100px", height: "100px", margin: "-50px 0 0 -50px", borderRadius: "50%", border: "4px solid var(--blue)" });
  return { words4, end, k, per, tagl, links, disc, ring, word };
}, (t, c) => {
  c.words4.forEach((d, i) => { const a = T.stacc[i], b = T.stacc[i + 1] ?? T.silence; show(d, t >= a && t < b); d.style.transform = `scale(${1.25 - 0.25 * eo(P(t, a, a + 0.25))})`; });
  show(c.end, t >= T.endLogo - 0.6);
  // silence: the dot alone on black, then it lands as the period
  const r = c.per.getBoundingClientRect(); const px = r.left + 36, py = r.bottom - 56;
  if (t >= T.silence && t < T.endLogo) { const kk = eio(P(t, T.endLogo - 0.6, T.endLogo)); setDot(lerp(960, px, kk), lerp(540, py, kk), 18 + 12 * kk, P(t, T.silence + 0.2, T.silence + 0.6)); c.end.style.opacity = P(t, T.endLogo - 0.6, T.endLogo); }
  else if (t >= T.endLogo) { setDot(px, py, 30, 1 - P(t, DURATION - 1, DURATION)); c.end.style.opacity = 1; }
  c.k.style.clipPath = `inset(0 ${100 - eo(P(t, T.endLogo, T.endLogo + 0.5)) * 100}% 0 0)`;
  c.word.style.transform = `scale(${1.06 - 0.06 * eo(P(t, T.endLogo, T.endLogo + 1.2))})`;
  const rk = P(t, T.endLogo, T.endLogo + 0.9); css(c.ring, { left: px + "px", top: py + "px", transform: `scale(${0.5 + rk * 6})`, opacity: rk > 0 && rk < 1 ? 1 - rk : 0 });
  c.tagl.style.opacity = P(t, T.endLogo + 0.8, T.endLogo + 1.2); c.links.style.opacity = P(t, T.endLogo + 1.4, T.endLogo + 1.8); c.disc.style.opacity = P(t, T.endLogo + 2.0, T.endLogo + 2.4);
  S.close.el.style.opacity = 1 - P(t, DURATION - 1, DURATION);
});

// ---------- render
const TAGS = [[22.2, 30.2, "Live app · PayPal simulator"], [30.2, 36, "Illustration · Claude drafting not run live"], [36, 54, "Real output of Kept's verifier"], [54, 63, "Live app · public verify page"], [63, 111, "Live app · PayPal simulator"], [111, 125, "Real API responses · PayPal simulator"], [125, 133, "Live app · PayPal simulator"]];
window.render = (t) => {
  D = null;
  for (const id in S) {
    const { el, sc, ctx, update } = S[id];
    const on = t >= sc.start - 0.001 && t < sc.end;
    el.style.display = on ? "block" : "none";
    if (on) { el.style.opacity = 1; update(t, ctx); }
  }
  // chapter pills + ruler
  const chOn = t >= 22.4 && t < 132.8;
  const ch = $("chapters"); ch.style.opacity = P(t, 22.4, 22.9) * (1 - P(t, 132.4, 132.8)); show(ch, chOn);
  const dark = (t >= 36 && t < 54) || (t >= 91 && t < 93.2) || (t >= 111 && t < 125) || (t >= T.notUs && t < 111);
  $("pills").style.background = dark ? "rgba(30,30,30,.8)" : "rgba(255,255,255,.72)";
  pills.forEach((p, i) => { const a = p.c.start, b = CHAPTERS[i + 2].start; const on = t >= a && t < b; p.classList.toggle("on", on); p.style.color = on ? "#fff" : dark ? "#9a9a9a" : "#6b6b6b"; p.style.background = on ? (dark ? "#0066f5" : "#0a0a0a") : "transparent"; p.shine.style.left = on ? `${-60 + ((t - a) % 1.6) / 1.6 * (p.offsetWidth + 120)}px` : "-80px"; });
  const prog = P(t, 22, 133);
  [...$("ruler").children].forEach((tk, i) => { const on = i / 60 <= prog; tk.style.background = on ? "#0066f5" : dark ? "rgba(255,255,255,.2)" : "rgba(0,0,0,.18)"; });
  // corner tag
  const tg = TAGS.find(([a, b]) => t >= a && t < b);
  tag.style.opacity = tg ? P(t, tg[0], tg[0] + 0.3) * (1 - P(t, tg[1] - 0.3, tg[1])) : 0;
  if (tg) tag.querySelector("span").textContent = tg[2];
  // dot
  if (D && D.o > 0.001) css(dot, { display: "block", width: D.r * 2 + "px", height: D.r * 2 + "px", transform: `translate(${D.x - D.r}px, ${D.y - D.r}px)`, opacity: D.o }); else dot.style.display = "none";
  // flashes on the two logo hits
  flash.style.opacity = 0.85 * (1 - P(t, T.logoHit, T.logoHit + 0.25)) * (t >= T.logoHit ? 1 : 0) + 0.6 * (1 - P(t, T.endLogo, T.endLogo + 0.25)) * (t >= T.endLogo ? 1 : 0);
};
window.FRAMES = Math.round(DURATION * FPS); window.FPS = FPS;
window.ready = true;
const q = new URLSearchParams(location.search);
if (q.has("t")) window.render(Number(q.get("t")));
</script>
