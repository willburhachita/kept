<body>
<div id="stage">
  <div id="scenes" class="layer"></div>
  <div id="chapters"><div id="pills"></div><div id="ruler"></div></div>
  <div id="tag"><b></b><span></span></div>
  <div id="dot"></div>
  <div id="flash"></div>
</div>
<script type="module">
import { FPS, GITHUB, SITE, buildTimeline } from "./timeline.js";

// ---------- math
const cl = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const P = (t, a, b) => cl((t - a) / (b - a));
const eo = (x) => 1 - (1 - x) ** 3;
const eio = (x) => (x < 0.5 ? 4 * x * x * x : 1 - (-2 * x + 2) ** 3 / 2);
const back = (x) => { const c = 1.6; return 1 + (c + 1) * (x - 1) ** 3 + c * (x - 1) ** 2; };
const lerp = (a, b, x) => a + (b - a) * x;
const springIn = (t, t0, d = 0.55) => back(P(t, t0, t0 + d));
const h = (tag, cls, parent, html) => { const e = document.createElement(tag); if (cls) e.className = cls; if (html !== undefined) e.innerHTML = html; if (parent) parent.appendChild(e); return e; };
const css = (e, o) => { for (const k in o) e.style[k] = o[k]; };
const show = (e, on) => { e.style.display = on ? "" : "none"; };
const noise = (i) => { const x = Math.sin(i * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); };
const shake = (t, t0, d = 0.35, a = 24) => (t > t0 && t < t0 + d ? (noise(t * 61) - 0.5) * a * (1 - (t - t0) / d) : 0);

// ---------- data
const q = new URLSearchParams(location.search);
const CUT = q.get("cut") || "full";
const [shots, graph, calls, voIndex, typeClip] = await Promise.all([
  fetch("shots/shots.json").then((r) => r.json()),
  fetch("out/graph.json").then((r) => r.json()),
  fetch("data/agent-calls.json").then((r) => r.json()),
  fetch("out/vo/index.json").then((r) => r.json()),
  fetch("shots/type-clip.json").then((r) => r.json()),
]);
const TL = buildTimeline(voIndex, CUT), EV = TL.ev, VO = TL.vo;
await document.fonts.load("600 100px Inter"); await document.fonts.load("500 20px Mono");
const imgCache = new Map();
const IMG = (n) => { if (!imgCache.has(n)) { const i = new Image(); i.src = `shots/${n}.jpg`; imgCache.set(n, i); } return imgCache.get(n); };
const TYPE = Array.from({ length: 32 }, (_, i) => `type/t${String(Math.min(96, (i + 1) * 3)).padStart(3, "0")}`);
const NEED = ["y00_new", "y01_typed", "x61_scam2", "s34_proved", "s23_payer_review", "s20_payee_review", "s31_sim", "s32_live", "s24_payer_approved", "s40_deliver", "s41_chosen", "s42_delivered", "s43_review", "s44_settled", "x31_sam_bell", "x40_plumber", "s45_scroll0", "s51a_grid", "s52a_typing", "s53a_broken", "s50b_pre", "s52b_typing", "s53b_broken", "x10_link", "x11_link_typed", "x12_link_result", "s62_approved", "s70_bt", "s71_bt20", "s74_closed", "x50_docs", "x52_mcp_code", ...TYPE];
await Promise.all(NEED.map((n) => IMG(n).decode().catch(() => console.error("missing shot", n))));

// ---------- text helpers ("a b | c d": after | is gray; *word* is blue)
function words(parent, text, cls = "") {
  const box = h("div", cls, parent); let gray = false; const ws = [];
  for (const part of text.split(" ")) {
    if (part === "|") { gray = true; continue; }
    const blue = /^\*.*\*[.,!?]?$/.test(part);
    ws.push(h("span", "w" + (gray ? " gray" : "") + (blue ? " blue" : ""), box, part.replace(/\*/g, "") + " "));
  }
  box.ws = ws; return box;
}
const rise = (s, x, d = 32) => { s.style.opacity = eo(x); s.style.transform = `translateY(${(1 - eo(x)) * d}px)`; s.style.filter = x < 1 ? `blur(${(1 - x) * 7}px)` : ""; };
function playWords(box, t, t0, per = 0.07, dur = 0.4) { box.ws.forEach((s, i) => rise(s, P(t, t0 + i * per, t0 + i * per + dur))); }
/** words appear as the narrator reaches them (spread across [a, b]) */
function spanWords(box, t, a, b, lead = 0.05) { const n = box.ws.length; box.ws.forEach((s, i) => { const t0 = a + ((b - a) * i) / n - lead; rise(s, P(t, t0, t0 + 0.3)); }); }
const voWords = (box, t, id) => VO[id] && spanWords(box, t, VO[id].start, VO[id].end);
const pop = (e, t, t0, from = 0.7) => { const k = springIn(t, t0); e.style.opacity = P(t, t0, t0 + 0.12); e.style.transform = `scale(${from + (1 - from) * k})`; };

// ---------- app screen with camera, cursor and click ripple
function Screen(parent) {
  const el = h("div", "screen", parent), inner = h("div", "inner", el);
  const a = h("img", "", inner), b = h("img", "", inner);
  const hl = h("div", "hl", inner), rip = h("div", "ripple", inner);
  const cur = h("div", "cursor", inner, `<svg viewBox="0 0 24 24" width="46" height="46"><defs><linearGradient id="cg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff"/><stop offset="1" stop-color="#d9d9d9"/></linearGradient></defs><path d="M4 2l16 9.5-7 1.5-3.5 6.5z" fill="url(#cg)" stroke="#0a0a0a" stroke-width="1.4" stroke-linejoin="round"/></svg>`);
  return {
    el, inner,
    set(nA, nB = null, mix = 0, cam = [720, 405, 1]) {
      if (a.dataset.n !== nA) { a.src = IMG(nA).src; a.dataset.n = nA; }
      if (nB) { if (b.dataset.n !== nB) { b.src = IMG(nB).src; b.dataset.n = nB; } b.style.opacity = mix; show(b, true); } else show(b, false);
      const [fx, fy, z] = cam;
      inner.style.transform = `translate(${cl(720 - fx * z, 1440 - 1440 * z, 0)}px, ${cl(405 - fy * z, 810 - 810 * z, 0)}px) scale(${z})`;
    },
    cursor(x, y, on = true, press = 0) { show(cur, on); css(cur, { left: x + "px", top: y + "px", transform: `scale(${1 - 0.18 * press})` }); },
    ripple(x, y, k) { show(rip, k > 0 && k < 1); css(rip, { left: x + "px", top: y + "px", transform: `scale(${0.3 + k * 1.5})`, opacity: 1 - k }); },
    highlight(r, o) { show(hl, !!r && o > 0.01); if (r) css(hl, { left: r[0] - 6 + "px", top: r[1] - 6 + "px", width: r[2] + 12 + "px", height: r[3] + 12 + "px", opacity: o }); },
    pose({ x = 0, y = 0, s = 1, rx = 0, ry = 0, rz = 0, o = 1 }) { el.style.transform = `translate(${x}px, ${y}px) rotateX(${rx}deg) rotateY(${ry}deg) rotateZ(${rz}deg) scale(${s})`; el.style.opacity = o; },
    off() { this.cursor(0, 0, false); this.ripple(0, 0, 0); this.highlight(null, 0); },
  };
}
const R = (n, k) => { const r = shots[n]?.rects?.[k]; return r ? [r.x, r.y, r.width, r.height] : null; };
const ctr = (r) => [r[0] + r[2] / 2, r[1] + r[3] / 2];
function cursorTo(sc, t, from, to, t0, t1, tc) {
  const k = eio(P(t, t0, t1));
  sc.cursor(lerp(from[0], to[0], k), lerp(from[1], to[1], k) - Math.sin(Math.PI * k) * 50, true, tc ? Math.sin(Math.PI * P(t, tc - 0.08, tc + 0.12)) : 0);
  sc.ripple(to[0], to[1], tc ? P(t, tc, tc + 0.45) : 0);
}
function Crop(parent, name, r, scale = 1) {
  const el = h("div", "crop", parent), im = h("img", "", el); im.src = IMG(name).src;
  css(el, { width: r[2] * scale + "px", height: r[3] * scale + "px" });
  css(im, { width: 1440 * scale + "px", height: 810 * scale + "px", left: -r[0] * scale + "px", top: -r[1] * scale + "px" });
  return el;
}
function Burst(parent, color = "rgba(0,102,245,.5)", n = 28) {
  const NS = "http://www.w3.org/2000/svg", svg = document.createElementNS(NS, "svg");
  svg.setAttribute("viewBox", "-100 -100 200 200"); css(svg, { position: "absolute", width: "3000px", height: "3000px", pointerEvents: "none" });
  for (let i = 0; i < n; i++) { const p = document.createElementNS(NS, "path"); const a = (i / n) * Math.PI * 2, w = (Math.PI / n) * 0.55; p.setAttribute("d", `M0 0 L${100 * Math.cos(a - w)} ${100 * Math.sin(a - w)} L${100 * Math.cos(a + w)} ${100 * Math.sin(a + w)} Z`); p.setAttribute("fill", color); svg.appendChild(p); }
  parent.appendChild(svg);
  return (t, t0, at = [960, 540], life = 1.6) => { const k = P(t, t0, t0 + life); css(svg, { left: at[0] - 1500 + "px", top: at[1] - 1500 + "px", opacity: k > 0 && k < 1 ? Math.sin(Math.PI * k) : 0, transform: `rotate(${(t - t0) * 14}deg) scale(${0.4 + 0.8 * eo(k)})` }); };
}
const Toast = (parent, title, body, icon = "$") => h("div", "toast", parent, `<div class="ic">${icon}</div><div><div class="t1">${title}</div><div class="t2">${body}</div></div>`);
const glow = (el, bg, g = "rgba(0,102,245,.18)", at = "50% 60%") => { el.style.background = bg; const d = h("div", "glow", el); d.style.background = `radial-gradient(ellipse 50% 40% at ${at}, ${g}, transparent 70%)`; return d; };
const shoutEl = (parent, text, x, y, blue = false) => { const e = h("div", "shout" + (blue ? " b" : ""), parent, text); css(e, { left: x + "px", top: y + "px" }); return e; };
const shoutAt = (e, t, a, b) => { const k = springIn(t, a, 0.45); e.style.opacity = P(t, a, a + 0.1) * (1 - P(t, b - 0.2, b)); e.style.transform = `scale(${0.6 + 0.4 * k}) rotate(${-2 + 2 * k}deg)`; };

// ---------- global chrome
const $ = (id) => document.getElementById(id);
const pills = TL.chapters.map((c) => { const p = h("div", "pill", $("pills"), c.label); p.shine = h("div", "shine", p); p.c = c; return p; });
for (let i = 0; i <= 60; i++) { const tk = h("i", "", $("ruler")); css(tk, { left: (i / 60) * 758 + "px", height: (i % 5 === 0 ? 14 : 7) + "px" }); }
const dot = $("dot"), tag = $("tag"), flash = $("flash");
let D = null, TAG = null, DARK = false;
const setDot = (x, y, r = 14, o = 1) => { D = { x, y, r, o }; };

// ---------- scenes
const S = {};
const root = $("scenes");
function scene(id, build, update) { const sc = TL.scenes.find((s) => s.id === id); if (!sc) return; const el = h("div", "scene", root); S[id] = { el, sc, ctx: build(el, EV[id], sc), update }; }

// 1. COLD OPEN
scene("cold", (el, E) => {
  el.style.background = "#000";
  const U = h("div", "chat", el), A = h("div", "chat", el), B = h("div", "chat", el);
  const mk = (box, list) => list.map((m) => {
    if (m.div) { const d = h("div", "meta", box, m.div); css(d, { left: "0", right: "0", textAlign: "center", top: m.y + "px" }); d.m = m; return d; }
    const b = h("div", "bub " + m.side, box, m.text + (m.file ? `<div class="chip">${m.file}</div>` : "")); b.style.top = m.y + "px"; b.m = m;
    if (m.status) { const s = h("div", "meta", box, m.status); css(s, { right: "8px", top: m.y + (m.file ? 165 : 104) + "px" }); b.st = s; }
    return b;
  });
  const u = E.anyUpdate.length ? mk(U, [{ div: "To: Designer", y: 0, t: E.anyUpdate[0] - 0.4 }, ...E.anyUpdate.map((t, i) => ({ side: "me", text: "Any update?", y: 50 + i * 110, t, status: i === 3 ? "Delivered" : null, st: t + 0.25 }))]) : [];
  const a = mk(A, [{ div: "Mon 10:02", y: 0, t: E.bubbles[0] - 0.2 }, { side: "me", text: "Logo by Friday?", y: 50, t: E.bubbles[0] }, { side: "them", text: "Sure. Send $100 to start.", y: 160, t: E.bubbles[1] }, { side: "me", text: "Sent.", y: 270, t: E.bubbles[2], status: "Read 9:41", st: E.read }]);
  const b = mk(B, [{ div: "Designer · Friday", y: 0, t: E.flip + 0.3 }, { side: "me", text: "Final logo attached.", y: 50, t: E.logoBubble, file: "acme-logo.svg" }, { side: "them", text: "Love it. Paying today!", y: 245, t: E.logoBubble + 0.55 }, { div: "Client · last seen 3 weeks ago", y: 380, t: E.lastSeen }]);
  const parts = Array.from({ length: 18 }, () => { const p = h("div", "", B); css(p, { position: "absolute", width: "14px", height: "14px", borderRadius: "50%", background: "#4a4a4a" }); return p; });
  const line = h("div", "cap", el); css(line, { top: "380px", color: "#fff", fontSize: "120px", lineHeight: "1.02" });
  const l1 = words(line, "The payment *worked.*"), l2 = words(line, "| The promise didn't.");
  return { U, A, B, u, a, b, parts, line, l1, l2 };
}, (t, c, E) => {
  const popAll = (arr) => arr.forEach((e) => { const k = springIn(t, e.m.t, 0.5); e.style.opacity = P(t, e.m.t, e.m.t + 0.12); e.style.transform = `scale(${0.6 + 0.4 * k}) translateY(${(1 - P(t, e.m.t, e.m.t + 0.35)) * 30}px)`; e.style.transformOrigin = e.m.side === "them" ? "0 100%" : "100% 100%"; if (e.st) e.st.style.opacity = P(t, e.m.st, e.m.st + 0.15); });
  popAll(c.u); popAll(c.a); popAll(c.b);
  show(c.U, c.u.length > 0 && t < E.bubbles[0] - 0.1); c.U.style.opacity = 1 - P(t, E.bubbles[0] - 0.4, E.bubbles[0] - 0.15);
  const z = eio(P(t, E.read, E.read + 0.45)) * (1 - eio(P(t, E.flip - 0.25, E.flip)));
  c.A.style.transform = `rotateY(${eio(P(t, E.flip, E.flip + 0.4)) * 90}deg) scale(${1 + 0.42 * z}) translate(${-40 * z}px, ${-70 * z}px)`;
  show(c.A, t >= E.bubbles[0] - 0.3 && t < E.flip + 0.4);
  const g = P(t, E.flip + 0.25, E.flip + 0.6);
  c.B.style.transform = `rotateY(${(1 - eo(g)) * -90}deg)`; show(c.B, g > 0 && t < E.line1); c.B.style.opacity = 1 - P(t, E.line1 - 0.3, E.line1 - 0.05);
